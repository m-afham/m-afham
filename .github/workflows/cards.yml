name: Render README cards

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    paths: ["scripts/render_cards.py"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards (hero, tiles, spotlight, repos, activity)
        env:
          # A PAT (read:user) in PROFILE_TOKEN makes the activity card include private
          # contributions, matching your profile graph. Falls back to the workflow token.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/render_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || (git commit -m "Refresh README cards" && git push)
