<svg xmlns="http://www.w3.org/2000/svg" width="143" height="44" viewBox="0 0 143 44" role="img" aria-label="Hire Me" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Hire Me</title><style>
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(4px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cnt{display:none}.final{opacity:1!important}}</style><g transform="translate(6 0)"><rect x="0" y="0" width="131" height="44" rx="22" fill="#0071E3"/><g transform="translate(22 14)"><rect x="0" y="2" width="16" height="12" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/><path d="M1 4l7 5 7-5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/></g><text x="47" y="27.5" font-size="15" font-weight="600" fill="#FFFFFF">Hire Me</text></g></svg>