<svg xmlns="http://www.w3.org/2000/svg" width="286" height="176" viewBox="0 0 286 176" role="img" aria-label="7+ Years on Apple platforms" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>7+ Years on Apple platforms</title><style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
