<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Muhammad Afham, Lead iOS &amp; macOS Engineer" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Muhammad Afham, Lead iOS &amp; macOS Engineer</title><style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{r:5;opacity:.6}100%{r:13;opacity:0}}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(4px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cnt{display:none}.final{opacity:1!important}}</style>
<defs>
  <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="300">
    <stop offset="0" stop-color="#0A84FF"/><stop offset=".35" stop-color="#BF5AF2"/>
    <stop offset=".65" stop-color="#FF375F"/><stop offset="1" stop-color="#FF9F0A"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 440 150;360 440 150" dur="10s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0">
    <stop offset="0" stop-color="#F5F5F7"/><stop offset=".42" stop-color="#F5F5F7"/>
    <stop offset=".5" stop-color="#0A84FF"/><stop offset=".58" stop-color="#F5F5F7"/>
    <stop offset="1" stop-color="#F5F5F7"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;-600 0;600 0;600 0" keyTimes="0;.55;.85;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="878" height="298" rx="24" fill="#161618"/>
<rect x="1" y="1" width="878" height="298" rx="24" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".85"/>
<g class="r" style="animation-delay:.1s"><text x="48" y="74" font-size="13" font-weight="600" letter-spacing="1.6" fill="#0A84FF">LEAD iOS &amp; macOS ENGINEER · MOBILE ARCHITECTURE</text></g>
<g class="r" style="animation-delay:.25s"><text x="46" y="134" font-size="52" font-weight="700" letter-spacing="-1.2" fill="url(#shine)">Muhammad Afham</text></g>
<g class="r" style="animation-delay:.4s"><text x="48" y="174" font-size="18" fill="#98989D">Crafting exceptional mobile experiences with precision and passion.</text></g>
<g class="r" style="animation-delay:.55s"><text x="48" y="212" font-size="15" fill="#F5F5F7">
  <tspan font-weight="600">7+</tspan><tspan fill="#98989D"> years  ·  </tspan><tspan font-weight="600">25+</tspan><tspan fill="#98989D"> apps shipped  ·  iOS &amp; macOS  ·  Pakistan</tspan></text></g>
<g class="r" style="animation-delay:.7s">
  <rect x="48" y="232" width="336" height="32" rx="16" fill="#30D158" opacity=".12"/>
  <circle cx="68" cy="248" r="5" fill="#30D158" style="animation:pulse 2s ease-in-out infinite"/>
  <circle cx="68" cy="248" r="5" fill="none" stroke="#30D158" style="animation:ring 2s ease-out infinite"/>
  <text x="82" y="253" font-size="13.5" font-weight="500" fill="#30D158">Available for contract &amp; consulting work</text>
</g>
