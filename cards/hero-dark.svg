<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Muhammad Afham, Lead iOS &amp; macOS Engineer" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Muhammad Afham, Lead iOS &amp; macOS Engineer</title><style>
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(4px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cnt{display:none}.final{opacity:1!important}}</style>
<defs>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0">
    <stop offset="0" stop-color="#F5F5F7"/><stop offset=".42" stop-color="#F5F5F7"/>
    <stop offset=".5" stop-color="#0A84FF"/><stop offset=".58" stop-color="#F5F5F7"/>
    <stop offset="1" stop-color="#F5F5F7"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;-600 0;600 0;600 0" keyTimes="0;.55;.85;1" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect x=".5" y=".5" width="879" height="279" rx="24" fill="#161618" stroke="#2C2C2E"/>
<g class="r" style="animation-delay:.1s"><text x="48" y="72" font-size="13" font-weight="600" letter-spacing="1.6" fill="#0A84FF">LEAD iOS &amp; macOS ENGINEER · MOBILE ARCHITECTURE</text></g>
<g class="r" style="animation-delay:.25s"><text x="46" y="130" font-size="52" font-weight="700" letter-spacing="-1.2" fill="url(#shine)">Muhammad Afham</text></g>
<g class="r" style="animation-delay:.4s"><text x="48" y="168" font-size="18" fill="#98989D">Crafting exceptional mobile experiences with precision and passion.</text></g>
<g class="r" style="animation-delay:.55s"><text x="48" y="204" font-size="15" fill="#98989D">
  <tspan font-weight="600" fill="#F5F5F7">7+</tspan> years  ·  <tspan font-weight="600" fill="#F5F5F7">25+</tspan> apps shipped  ·  iOS &amp; macOS  ·  Pakistan</text></g>
<g class="r" style="animation-delay:.7s">
  <rect x="48.5" y="224.5" width="315" height="29" rx="14.5" fill="none" stroke="#3A3A3C"/>
  <circle cx="66" cy="239" r="4.5" fill="#30D158" style="animation:pulse 2.4s ease-in-out infinite"/>
  <text x="79" y="243.5" font-size="13" font-weight="500" fill="#F5F5F7">Available for contract &amp; consulting work</text>
</g>
<rect x="668" y="58" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.08" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 0.80s both"/><rect x="730" y="58" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.14" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 0.86s both"/><rect x="792" y="58" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.06" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 0.92s both"/><rect x="668" y="120" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.12" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 0.98s both"/><rect x="730" y="120" width="50" height="50" rx="12" fill="#0A84FF" fill-opacity="1" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 1.04s both"/><rect x="792" y="120" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.18" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 1.10s both"/><rect x="668" y="182" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.05" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 1.16s both"/><rect x="730" y="182" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.1" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 1.22s both"/><rect x="792" y="182" width="50" height="50" rx="12" fill="#F5F5F7" fill-opacity="0.15" style="transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) 1.28s both"/>
</svg>