<svg xmlns="http://www.w3.org/2000/svg" width="432" height="158" viewBox="0 0 432 158" role="img" aria-label="SensorMotionEffect: Add a depth effect to UIImageView using Core Motion Manager." font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>SensorMotionEffect: Add a depth effect to UIImageView using Core Motion Manager.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{r:5;opacity:.6}100%{r:13;opacity:0}}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(4px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cnt{display:none}.final{opacity:1!important}}</style>
<g class="r" style="animation-delay:0.12s">
