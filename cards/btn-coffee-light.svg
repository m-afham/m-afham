<svg xmlns="http://www.w3.org/2000/svg" width="212" height="44" viewBox="0 0 212 44" role="img" aria-label="Buy Me a Coffee" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Buy Me a Coffee</title><style>
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(4px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cnt{display:none}.final{opacity:1!important}}</style><g transform="translate(6 0)"><rect x=".75" y=".75" width="198.5" height="42.5" rx="21.25" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="1.5"/><g transform="translate(22 14)"><path d="M1 4h11v5a4.5 4.5 0 0 1-4.5 4.5h-2A4.5 4.5 0 0 1 1 9z" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 5.5h1.2a2.3 2.3 0 0 1 0 4.6H12" fill="none" stroke="#1D1D1F" stroke-width="1.6"/></g><text x="47" y="27.5" font-size="15" font-weight="600" fill="#1D1D1F">Buy Me a Coffee</text></g></svg>